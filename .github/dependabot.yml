version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Newtonsoft.Json 10.0.2 was only declared in the removed
    # AzCopyAndDelete/AzCopyAndDelete/packages.config (Dependabot #2).
    # SDK-style projects on this branch do not reference it.
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
