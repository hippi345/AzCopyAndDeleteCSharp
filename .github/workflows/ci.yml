name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AzCopyAndDelete.sln

      - name: Format check
        run: dotnet format AzCopyAndDelete.sln --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build AzCopyAndDelete.sln --no-restore -c Release

      - name: Test
        run: dotnet test AzCopyAndDelete.sln --no-build -c Release --verbosity normal
